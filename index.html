<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تقييم الفروع</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}
.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 3px 15px #ccc;
    text-align:center;
}
.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}
.card{
    background:white;
    padding:16px;
    margin:12px 0;
    border-radius:15px;
    box-shadow:0 2px 8px #ddd;
}
h1,h2{
    text-align:center;
}
label{
    display:block;
    font-weight:bold;
    margin-top:10px;
}
input,select,button{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    background:#222;
    color:white;
    border:0;
    cursor:pointer;
    margin-top:15px;
}
.error{
    color:red;
    margin-top:10px;
    font-weight:bold;
}
.score{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:15px;
}
.row{
    padding:12px;
    margin:8px 0;
    background:#f7f7f7;
    border-radius:10px;
}
.good{
    color:green;
    font-weight:bold;
}
.bad{
    color:red;
    font-weight:bold;
}
.same{
    color:#777;
    font-weight:bold;
}
.hidden{
    display:none;
}
</style>
</head>
<body>
<!-- شاشة الدخول -->
<div id="loginPage" class="login">
<div class="login-box">
<h2>🔐 تسجيل الدخول</h2>
<p>أدخل رمز الدخول للمتابعة</p>
<input
    type="password"
    id="password"
    placeholder="رمز الدخول"
>
<button onclick="login()">
دخول
</button>
<div id="loginError" class="error"></div>
</div>
</div>
<!-- التطبيق -->
<div id="app" class="container hidden">
<h1>📊 نظام تقييم فروع المطعم</h1>
<div class="card">
<label>الفرع</label>
<select id="branch">
<option>بسماية</option>
<option>غدير</option>
<option>حي العامل</option>
<option>البعيثة</option>
<option>حي الجهاد</option>
<option>شهداء البياع</option>
<option>الأعظمية</option>
<option>بنوك</option>
<option>شعب</option>
<option>دورة</option>
<option>غزالية</option>
<option>مدائن</option>
<option>حرية</option>
</select>
<label>التاريخ</label>
<input type="date" id="date">
</div>
<div class="card">
<label>المنطقة الأمامية — 10</label>
<input type="number" id="front" min="0" max="10">
<label>المطبخ — 20</label>
<input type="number" id="kitchen" min="0" max="20">
<label>السلامة العامة — 10</label>
<input type="number" id="safety" min="0" max="10">
<label>التشغيل — 15</label>
<input type="number" id="operation" min="0" max="15">
<label>الكاشير — 5</label>
<input type="number" id="cashier" min="0" max="5">
<label>المخزن — 10</label>
<input type="number" id="store" min="0" max="10">
<label>الأمور الممنوعة — 10</label>
<input type="number" id="forbidden" min="0" max="10">
<label>سكن العمال — 10</label>
<input type="number" id="housing" min="0" max="10">
<label>سرعة الاستجابة — 10</label>
<input type="number" id="response" min="0" max="10">
<button onclick="saveEvaluation()">
💾 حفظ التقييم
</button>
<div id="score" class="score">
المجموع: 0 / 100
</div>
</div>
<div class="card">
<h2>📅 التقرير الأسبوعي</h2>
<button onclick="weeklyReport()">
عرض التقرير
</button>
<div id="report"></div>
</div>
<div class="card">
<button onclick="logout()">
🔒 تسجيل الخروج
</button>
</div>
</div>
<script>
/* رمز الدخول */
const LOGIN_PASSWORD = "cindrell@123";
/* الفروع */
const branches = [
"بسماية",
"غدير",
"حي العامل",
"البعيثة",
"حي الجهاد",
"شهداء البياع",
"الأعظمية",
"بنوك",
"شعب",
"دورة",
"غزالية",
"مدائن",
"حرية"
];
/* أقسام التقييم */
const fields = [
"front",
"kitchen",
"safety",
"operation",
"cashier",
"store",
"forbidden",
"housing",
"response"
];
/* تسجيل الدخول */
function login(){
const password =
document.getElementById("password").value;
if(password === LOGIN_PASSWORD){
sessionStorage.setItem("loggedIn","yes");
document.getElementById("loginPage")
    .classList.add("hidden");
document.getElementById("app")
    .classList.remove("hidden");
}else{
document.getElementById("loginError").innerText =
"رمز الدخول غير صحيح ❌";
}
}
/* تسجيل الخروج */
function logout(){
sessionStorage.removeItem("loggedIn");
document.getElementById("app")
    .classList.add("hidden");
document.getElementById("loginPage")
    .classList.remove("hidden");
document.getElementById("password").value="";
}
/* إذا سبق تسجيل الدخول */
if(sessionStorage.getItem("loggedIn")==="yes"){
document.getElementById("loginPage")
    .classList.add("hidden");
document.getElementById("app")
    .classList.remove("hidden");
}
/* التاريخ */
document.getElementById("date").value =
new Date().toISOString().split("T")[0];
/* قراءة البيانات */
function getData(){
return JSON.parse(
localStorage.getItem("branchEvaluations") || "[]"
);
}
/* حفظ البيانات */
function saveData(data){
localStorage.setItem(
"branchEvaluations",
JSON.stringify(data)
);
}
/* حساب التقييم */
function calculateTotal(){
let total=0;
fields.forEach(id=>{
total += Number(
document.getElementById(id).value || 0
);
});
return total;
}
/* حفظ التقييم */
function saveEvaluation(){
const branch =
document.getElementById("branch").value;
const date =
document.getElementById("date").value;
if(!date){
alert("اختار التاريخ");
return;
}
const total = calculateTotal();
if(total > 100){
alert("المجموع لا يمكن أن يتجاوز 100");
return;
}
let data = getData();
/* تحديث تقييم نفس الفرع ونفس اليوم */
data = data.filter(item =>
!(item.branch === branch &&
  item.date === date)
);
data.push({
branch:branch,
date:date,
score:total
});
saveData(data);
document.getElementById("score").innerText =
"المجموع: " + total + " / 100";
alert("تم حفظ التقييم بنجاح ✅");
}
/* متوسط الفرع */
function averageForPeriod(branch,start,end){
const data = getData();
const list = data.filter(item =>
item.branch === branch &&
item.date >= start &&
item.date <= end
);
if(list.length===0){
return null;
}
const total =
list.reduce(
(sum,item)=>sum + item.score,
0
);
return total / list.length;
}
/* الأسبوع */
function getWeek(offset){
const now = new Date();
let day = now.getDay();
if(day===0){
day=7;
}
const monday = new Date(now);
monday.setDate(
now.getDate() -
day +
1 +
(offset*7)
);
const sunday = new Date(monday);
sunday.setDate(
monday.getDate()+6
);
function formatDate(d){
const y = d.getFullYear();
const m =
String(d.getMonth()+1)
.padStart(2,"0");
const day =
String(d.getDate())
.padStart(2,"0");
return y+"-"+m+"-"+day;
}
return [
formatDate(monday),
formatDate(sunday)
];
}
/* التقرير الأسبوعي */
function weeklyReport(){
const current = getWeek(0);
const previous = getWeek(-1);
let results=[];
branches.forEach(branch=>{
const currentAvg =
averageForPeriod(
branch,
current[0],
current[1]
);
const previousAvg =
averageForPeriod(
branch,
previous[0],
previous[1]
);
if(currentAvg !== null){
let change=null;
if(previousAvg !== null){
change =
currentAvg -
previousAvg;
}
results.push({
branch:branch,
current:currentAvg,
previous:previousAvg,
change:change
});
}
});
/* الأفضل إلى الأسوأ */
results.sort(
(a,b)=>b.current-a.current
);
let html="";
html +=
"<p><b>الأسبوع الحالي:</b> "+
current[0]+
" إلى "+
current[1]+
"</p>";
html +=
"<p><b>الأسبوع السابق:</b> "+
previous[0]+
" إلى "+
previous[1]+
"</p>";
if(results.length===0){
html +=
"<p>لا توجد تقييمات محفوظة لهذا الأسبوع.</p>";
document.getElementById("report")
.innerHTML=html;
return;
}
results.forEach((item,index)=>{
let status="";
let className="same";
let percentage="";
if(item.change===null){
status="جديد";
}else{
if(item.previous !== 0){
const percent =
(item.change /
item.previous) * 100;
percentage =
" — "+
(percent>0?"+":"")+
percent.toFixed(1)+
"%";
}
if(item.change>0){
status="⬆️ متحسن";
className="good";
}else if(item.change<0){
status="⬇️ متراجع";
className="bad";
}else{
status="➖ ثابت";
className="same";
}
}
html +=
'<div class="row">'+
"<b>"+
(index+1)+
". "+
item.branch+
"</b>"+
"<br>"+
"هذا الأسبوع: "+
item.current.toFixed(1)+
" / 100"+
"<br>"+
(
item.previous===null
?
"الأسبوع السابق: لا يوجد تقييم"
:
"الأسبوع السابق: "+
item.previous.toFixed(1)+
" / 100"
)+
"<br>"+
'<span class="'+
className+
'">'+
status+
percentage+
"</span>"+
"</div>";
});
document.getElementById("report")
.innerHTML=html;
}
</script>
</body>
</html>
