<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام تقييم الفروع</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f2f3f5;
color:#222;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
padding:18px;
margin:12px 0;
border-radius:15px;
box-shadow:0 2px 8px #ddd;
}

h1,h2{
text-align:center;
}

label{
display:block;
font-weight:bold;
margin-top:10px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#222;
color:#fff;
border:0;
cursor:pointer;
margin-top:15px;
}

.score{
font-size:28px;
font-weight:bold;
text-align:center;
margin-top:15px;
}

.row{
background:#f7f7f7;
padding:14px;
margin:10px 0;
border-radius:12px;
}

.good{
color:green;
font-weight:bold;
}

.bad{
color:red;
font-weight:bold;
}

.same{
color:#777;
font-weight:bold;
}

.delete{
background:#b00020;
}

.hidden{
display:none;
}


/* جدول التقرير */

.report-table{
width:100%;
border-collapse:collapse;
margin-top:15px;
direction:rtl;
}

.report-table th,
.report-table td{
border:1px solid #ccc;
padding:10px 5px;
text-align:center;
}

.report-table th{
background:#222;
color:white;
}

.report-table tr:nth-child(even){
background:#f5f5f5;
}

.percent{
font-weight:bold;
font-size:18px;
}


/* شاشة الطباعة / PDF */

@media print{

@page{
size:A4;
margin:15mm;
}

body{
background:white;
font-family:Arial,Tahoma,sans-serif;
}

#loginPage{
display:none !important;
}

#app > h1{
display:none !important;
}

#app > .card:not(:has(#report)){
display:none !important;
}

#app{
display:block !important;
max-width:100%;
padding:0;
}

.card{
box-shadow:none;
margin:0;
padding:0;
}

#report{
display:block !important;
direction:rtl;
text-align:right;
font-family:Arial,Tahoma,sans-serif;
}

.report-title{
display:block !important;
text-align:center;
margin-bottom:20px;
}

.report-table{
display:table !important;
width:100%;
border-collapse:collapse;
direction:rtl;
font-family:Arial,Tahoma,sans-serif;
}

.report-table th,
.report-table td{
border:1px solid #000;
padding:8px;
text-align:center;
}

.report-table th{
background:#eee !important;
color:#000 !important;
}

button{
display:none !important;
}

select,
input{
display:none !important;
}

}
</style>
</head>

<body>

<!-- تسجيل الدخول -->

<div id="loginPage" class="container">

<div class="card">

<h1>🔐 تسجيل الدخول</h1>

<p style="text-align:center">
نظام تقييم فروع المطعم
</p>

<input
type="password"
id="password"
placeholder="أدخل رمز الدخول"
>

<button onclick="login()">
دخول
</button>

<p id="loginError" class="bad"></p>

</div>

</div>


<!-- التطبيق -->

<div id="app" class="container hidden">

<h1>📊 نظام تقييم فروع المطعم</h1>


<!-- التقييم اليومي -->

<div class="card">

<h2>📝 التقييم اليومي</h2>

<label>الفرع</label>

<select id="branch">

<option>بسماية</option>
<option>غدير</option>
<option>حي العامل</option>
<option>البعيثة</option>
<option>حي الجهاد</option>
<option>شهداء البياع</option>
<option>الأعظمية</option>
<option>بنوك</option>
<option>شعب</option>
<option>دورة</option>
<option>غزالية</option>
<option>مدائن</option>
<option>حرية</option>

</select>


<label>تاريخ التقييم</label>

<input
type="date"
id="date"
>


<label>المنطقة الأمامية — 10</label>
<input type="number" id="front" min="0" max="10">

<label>المطبخ — 20</label>
<input type="number" id="kitchen" min="0" max="20">

<label>السلامة العامة — 10</label>
<input type="number" id="safety" min="0" max="10">

<label>التشغيل — 15</label>
<input type="number" id="operation" min="0" max="15">

<label>الكاشير — 5</label>
<input type="number" id="cashier" min="0" max="5">

<label>المخزن — 10</label>
<input type="number" id="store" min="0" max="10">

<label>الأمور الممنوعة — 10</label>
<input type="number" id="forbidden" min="0" max="10">

<label>سكن العمال — 10</label>
<input type="number" id="housing" min="0" max="10">

<label>سرعة الاستجابة — 10</label>
<input type="number" id="response" min="0" max="10">


<button onclick="saveEvaluation()">
💾 حفظ التقييم اليومي
</button>


<div id="score" class="score">
المجموع: 0 / 100
</div>

</div>


<!-- مشاهدة التقييمات اليومية -->

<div class="card">

<h2>📋 التقييمات اليومية</h2>

<select id="viewBranch" onchange="showEvaluations()">

<option value="all">كل الفروع</option>

<option>بسماية</option>
<option>غدير</option>
<option>حي العامل</option>
<option>البعيثة</option>
<option>حي الجهاد</option>
<option>شهداء البياع</option>
<option>الأعظمية</option>
<option>بنوك</option>
<option>شعب</option>
<option>دورة</option>
<option>غزالية</option>
<option>مدائن</option>
<option>حرية</option>

</select>

<div id="evaluationsList"></div>

</div>


<!-- التقرير الأسبوعي -->

<div class="card">

<h2>📊 التقرير الأسبوعي</h2>

<button onclick="weeklyReport()">
عرض التقرير
</button>

<button onclick="downloadPDF()">
📄 حفظ التقرير PDF بالعربي
</button>

<div id="report"></div>

</div>


<!-- خروج -->

<div class="card">

<button onclick="logout()">
🔒 تسجيل الخروج
</button>

</div>

</div>


<script>


/* رمز الدخول */

const LOGIN_PASSWORD="cindrell@123";


/* الفروع */

const branches=[

"بسماية",
"غدير",
"حي العامل",
"البعيثة",
"حي الجهاد",
"شهداء البياع",
"الأعظمية",
"بنوك",
"شعب",
"دورة",
"غزالية",
"مدائن",
"حرية"

];


/* الأقسام */

const sections=[

{
id:"front",
name:"المنطقة الأمامية",
max:10
},

{
id:"kitchen",
name:"المطبخ",
max:20
},

{
id:"safety",
name:"السلامة العامة",
max:10
},

{
id:"operation",
name:"التشغيل",
max:15
},

{
id:"cashier",
name:"الكاشير",
max:5
},

{
id:"store",
name:"المخزن",
max:10
},

{
id:"forbidden",
name:"الأمور الممنوعة",
max:10
},

{
id:"housing",
name:"سكن العمال",
max:10
},

{
id:"response",
name:"سرعة الاستجابة",
max:10
}

];


/* تسجيل الدخول */

function login(){

const password=
document.getElementById("password").value;

if(password===LOGIN_PASSWORD){

sessionStorage.setItem(
"loggedIn",
"yes"
);

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

showEvaluations();

}else{

document
.getElementById("loginError")
.innerText=
"رمز الدخول غير صحيح ❌";

}

}


/* تسجيل الخروج */

function logout(){

sessionStorage.removeItem("loggedIn");

location.reload();

}


/* فتح التطبيق إذا مسجل */

if(
sessionStorage.getItem("loggedIn")==="yes"
){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

}


/* تاريخ اليوم */

document.getElementById("date").value=
new Date().toISOString().split("T")[0];


/* جلب البيانات */

function getData(){

return JSON.parse(
localStorage.getItem(
"branchEvaluations"
)||"[]"
);

}


/* حفظ البيانات */

function saveData(data){

localStorage.setItem(
"branchEvaluations",
JSON.stringify(data)
);

}


/* حفظ التقييم اليومي */

function saveEvaluation(){

const branch=
document.getElementById("branch").value;

const date=
document.getElementById("date").value;


if(!date){

alert("يرجى اختيار تاريخ التقييم");

return;

}


let scores={};

let total=0;


for(const section of sections){

const value=Number(
document.getElementById(section.id).value || 0
);


if(
value<0 ||
value>section.max
){

alert(
section.name+
" يجب أن يكون بين 0 و "+
section.max
);

return;

}


scores[section.id]=value;

total+=value;

}


let data=getData();


/*
تقييم واحد للفرع في اليوم.
إذا عدلت التقييم بنفس اليوم
يتم استبدال القديم.
*/

data=data.filter(item=>!(
item.branch===branch &&
item.date===date
));


data.push({

branch:branch,

date:date,

score:total,

scores:scores

});


saveData(data);


document.getElementById("score").innerText=
"المجموع: "+
total+
" / 100";


alert("تم حفظ التقييم اليومي ✅");


showEvaluations();

}


/* مشاهدة التقييمات */

function showEvaluations(){

const selected=
document.getElementById("viewBranch").value;

let data=getData();


if(selected!=="all"){

data=data.filter(
item=>item.branch===selected
);

}


data.sort(
(a,b)=>b.date.localeCompare(a.date)
);


let html="";


if(!data.length){

document.getElementById(
"evaluationsList"
).innerHTML=
"<p style='text-align:center'>لا توجد تقييمات.</p>";

return;

}


data.forEach(item=>{

html+=`

<div class="row">

<h3>🏪 ${item.branch}</h3>

<b>التاريخ:</b>
${item.date}

<br><br>

<b>النتيجة:</b>

<span class="percent ${
item.score>=80
?"good"
:item.score<60
?"bad"
:"same"
}">

${item.score}%

</span>

<br><br>

<details>

<summary>
مشاهدة تفاصيل التقييم
</summary>

<br>

${sections.map(section=>`

<div>

${section.name}:
<b>
${item.scores[section.id] || 0}/${section.max}
</b>

</div>

`).join("")}

</details>

<button
class="delete"
onclick="deleteEvaluation('${item.branch}','${item.date}')">

🗑️ حذف

</button>

</div>

`;

});


document.getElementById(
"evaluationsList"
).innerHTML=html;

}


/* حذف التقييم */

function deleteEvaluation(
branch,
date
){

if(!confirm(
"هل تريد حذف هذا التقييم؟"
)){

return;

}


let data=getData();


data=data.filter(item=>!(
item.branch===branch &&
item.date===date
));


saveData(data);

showEvaluations();

}


/* حساب بداية ونهاية الأسبوع */

function getWeek(offset=0){

const now=new Date();

let day=now.getDay();

if(day===0){

day=7;

}


const monday=new Date(now);

monday.setHours(0,0,0,0);

monday.setDate(
now.getDate()-
day+
1+
(offset*7)
);


const sunday=new Date(monday);

sunday.setDate(
monday.getDate()+6
);

sunday.setHours(23,59,59,999);


function format(date){

return date.getFullYear()+
"-"+
String(
date.getMonth()+1
).padStart(2,"0")+
"-"+
String(
date.getDate()
).padStart(2,"0");

}


return[
format(monday),
format(sunday)
];

}


/* متوسط تقييم الفرع للأسبوع */

function weeklyAverage(
branch,
start,
end
){

const data=getData();


const list=data.filter(item=>

item.branch===branch &&
item.date>=start &&
item.date<=end

);


if(!list.length){

return null;

}


const total=list.reduce(
(sum,item)=>sum+Number(item.score),
0
);


return total/list.length;

}


/* التقرير الأسبوعي */

function weeklyReport(){

const current=
getWeek(0);

const previous=
getWeek(-1);


let results=[];


branches.forEach(branch=>{

const currentAverage=
weeklyAverage(
branch,
current[0],
current[1]
);


const previousAverage=
weeklyAverage(
branch,
previous[0],
previous[1]
);


if(currentAverage!==null){

let change=null;


if(previousAverage!==null){

change=
currentAverage-
previousAverage;

}


results.push({

branch:branch,

current:currentAverage,

previous:previousAverage,

change:change

});

}

});


/*
ترتيب الأعلى إلى الأقل
*/

results.sort(
(a,b)=>b.current-a.current
);


let html=`


<div class="report-title">

<h2>📊 التقرير الأسبوعي</h2>

<p>
تاريخ التقرير:
${new Date().toLocaleDateString("ar-IQ")}
</p>

<p>
الأسبوع الحالي:
${current[0]} إلى ${current[1]}
</p>

</div>


<table class="report-table">

<thead>

<tr>

<th>الترتيب</th>

<th>الفرع</th>

<th>هذا الأسبوع</th>

<th>الأسبوع السابق</th>

<th>التغيير</th>

</tr>

</thead>

<tbody>

`;


if(!results.length){

html+=`

<tr>

<td colspan="5">
لا توجد تقييمات لهذا الأسبوع
</td>

</tr>

`;

}else{


results.forEach(
(item,index)=>{

let changeText="—";

let changeClass="same";


if(item.change!==null){

const percentageChange=
item.previous===0
?0
:(item.change/item.previous)*100;


if(percentageChange>0){

changeText=
"+"+
percentageChange.toFixed(1)+
"%";

changeClass="good";

}else if(percentageChange<0){

changeText=
percentageChange.toFixed(1)+
"%";

changeClass="bad";

}else{

changeText="0%";

}

}


html+=`

<tr>

<td>
${index+1}
</td>

<td>
<b>${item.branch}</b>
</td>

<td>
<b>
${item.current.toFixed(1)}%
</b>
</td>

<td>

${
item.previous===null
?"—"
:item.previous.toFixed(1)+"%"
}

</td>

<td class="${changeClass}">

<b>
${changeText}
</b>

</td>

</tr>

`;

});

}


html+=`

</tbody>

</table>

`;


document.getElementById(
"report"
).innerHTML=html;

}


/* حفظ PDF عربي */

function downloadPDF(){

/*
ننشئ التقرير أولاً
*/

weeklyReport();


setTimeout(()=>{

window.print();

},500);

}

</script>

</body>
</html>
