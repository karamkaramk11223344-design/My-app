<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تقييم الفروع</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f3f5;
color:#222;
}
.container{
max-width:900px;
margin:auto;
padding:15px;
}
.card{
background:white;
padding:18px;
margin:12px 0;
border-radius:15px;
box-shadow:0 2px 8px #ddd;
}
h1,h2{text-align:center}
label{
display:block;
font-weight:bold;
margin-top:10px;
}
input,select,button{
width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}
button{
background:#222;
color:white;
border:0;
cursor:pointer;
margin-top:15px;
}
.score{
font-size:28px;
font-weight:bold;
text-align:center;
margin-top:15px;
}
.row{
background:#f7f7f7;
padding:14px;
margin:10px 0;
border-radius:12px;
}
.good{
color:green;
font-weight:bold;
}
.bad{
color:red;
font-weight:bold;
}
.same{
color:#777;
font-weight:bold;
}
.strength{
color:green;
}
.weakness{
color:red;
}
.hidden{
display:none;
}
.reportHeader{
text-align:center;
border-bottom:2px solid #222;
padding-bottom:10px;
margin-bottom:15px;
}
.delete{
background:#b00020;
}
.details{
background:white;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>
<body>
<!-- تسجيل الدخول -->
<div id="loginPage" class="container">
<div class="card">
<h1>🔐 تسجيل الدخول</h1>
<p style="text-align:center">
نظام تقييم فروع المطعم
</p>
<input
type="password"
id="password"
placeholder="أدخل رمز الدخول"
>
<button onclick="login()">
دخول
</button>
<p id="loginError" class="bad"></p>
</div>
</div>
<!-- التطبيق -->
<div id="app" class="container hidden">
<h1>📊 نظام تقييم فروع المطعم</h1>
<!-- التقييم -->
<div class="card">
<h2>📝 التقييم اليومي</h2>
<label>الفرع</label>
<select id="branch">
<option>بسماية</option>
<option>غدير</option>
<option>حي العامل</option>
<option>البعيثة</option>
<option>حي الجهاد</option>
<option>شهداء البياع</option>
<option>الأعظمية</option>
<option>بنوك</option>
<option>شعب</option>
<option>دورة</option>
<option>غزالية</option>
<option>مدائن</option>
<option>حرية</option>
</select>
<label>تاريخ التقييم</label>
<input type="date" id="date">
<label>المنطقة الأمامية — 10</label>
<input type="number" id="front" min="0" max="10">
<label>المطبخ — 20</label>
<input type="number" id="kitchen" min="0" max="20">
<label>السلامة العامة — 10</label>
<input type="number" id="safety" min="0" max="10">
<label>التشغيل — 15</label>
<input type="number" id="operation" min="0" max="15">
<label>الكاشير — 5</label>
<input type="number" id="cashier" min="0" max="5">
<label>المخزن — 10</label>
<input type="number" id="store" min="0" max="10">
<label>الأمور الممنوعة — 10</label>
<input type="number" id="forbidden" min="0" max="10">
<label>سكن العمال — 10</label>
<input type="number" id="housing" min="0" max="10">
<label>سرعة الاستجابة — 10</label>
<input type="number" id="response" min="0" max="10">
<button onclick="saveEvaluation()">
💾 حفظ التقييم
</button>
<div id="score" class="score">
المجموع: 0 / 100
</div>
</div>
<!-- مشاهدة التقييمات -->
<div class="card">
<h2>📋 مشاهدة التقييمات</h2>
<label>اختيار الفرع</label>
<select id="viewBranch" onchange="showEvaluations()">
<option value="all">كل الفروع</option>
<option>بسماية</option>
<option>غدير</option>
<option>حي العامل</option>
<option>البعيثة</option>
<option>حي الجهاد</option>
<option>شهداء البياع</option>
<option>الأعظمية</option>
<option>بنوك</option>
<option>شعب</option>
<option>دورة</option>
<option>غزالية</option>
<option>مدائن</option>
<option>حرية</option>
</select>
<div id="evaluationsList"></div>
</div>
<!-- التقرير الأسبوعي -->
<div class="card">
<h2>📅 التقرير الأسبوعي</h2>
<button onclick="weeklyReport()">
📊 إنشاء التقرير
</button>
<button onclick="downloadPDF()">
📄 حفظ التقرير PDF
</button>
<div id="report"></div>
</div>
<!-- تسجيل الخروج -->
<div class="card">
<button onclick="logout()">
🔒 تسجيل الخروج
</button>
</div>
</div>
<script>
const LOGIN_PASSWORD="cindrell@123";
const branches=[
"بسماية",
"غدير",
"حي العامل",
"البعيثة",
"حي الجهاد",
"شهداء البياع",
"الأعظمية",
"بنوك",
"شعب",
"دورة",
"غزالية",
"مدائن",
"حرية"
];
const sections=[
{id:"front",name:"المنطقة الأمامية",max:10},
{id:"kitchen",name:"المطبخ",max:20},
{id:"safety",name:"السلامة العامة",max:10},
{id:"operation",name:"التشغيل",max:15},
{id:"cashier",name:"الكاشير",max:5},
{id:"store",name:"المخزن",max:10},
{id:"forbidden",name:"الأمور الممنوعة",max:10},
{id:"housing",name:"سكن العمال",max:10},
{id:"response",name:"سرعة الاستجابة",max:10}
];
function login(){
let password=document.getElementById("password").value;
if(password===LOGIN_PASSWORD){
sessionStorage.setItem("loggedIn","yes");
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
showEvaluations();
}else{
document.getElementById("loginError").innerText=
"رمز الدخول غير صحيح ❌";
}
}
function logout(){
sessionStorage.removeItem("loggedIn");
location.reload();
}
if(sessionStorage.getItem("loggedIn")==="yes"){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
}
document.getElementById("date").value=
new Date().toISOString().split("T")[0];
function getData(){
return JSON.parse(
localStorage.getItem("branchEvaluations")||"[]"
);
}
function saveData(data){
localStorage.setItem(
"branchEvaluations",
JSON.stringify(data)
);
}
function saveEvaluation(){
let branch=document.getElementById("branch").value;
let date=document.getElementById("date").value;
if(!date){
alert("يرجى اختيار تاريخ التقييم");
return;
}
let scores={};
let total=0;
for(let section of sections){
let value=Number(
document.getElementById(section.id).value||0
);
if(value<0 || value>section.max){
alert(
section.name+
" يجب أن يكون بين 0 و "+
section.max
);
return;
}
scores[section.id]=value;
total+=value;
}
let data=getData();
/* حذف تقييم سابق لنفس الفرع ونفس التاريخ */
data=data.filter(item=>!(
item.branch===branch &&
item.date===date
));
data.push({
branch:branch,
date:date,
score:total,
scores:scores
});
saveData(data);
document.getElementById("score").innerText=
"المجموع: "+total+" / 100";
alert("تم حفظ التقييم بنجاح ✅");
showEvaluations();
}
/* مشاهدة التقييمات */
function showEvaluations(){
let selected=
document.getElementById("viewBranch").value;
let data=getData();
if(selected!=="all"){
data=data.filter(
item=>item.branch===selected
);
}
data.sort(
(a,b)=>b.date.localeCompare(a.date)
);
let html="";
if(!data.length){
html="<p style='text-align:center'>لا توجد تقييمات محفوظة.</p>";
document.getElementById("evaluationsList").innerHTML=html;
return;
}
data.forEach((item,index)=>{
html+=`
<div class="row">
<h3>🏪 ${item.branch}</h3>
<b>📅 التاريخ:</b>
${item.date}
<br><br>
<b>⭐ المجموع:</b>
<span class="${item.score>=80?'good':item.score<60?'bad':'same'}">
${item.score} / 100
</span>
<div class="details">
<b>تفاصيل التقييم:</b>
<br><br>
${sections.map(section=>`
<div>
${section.name}:
<b>
${item.scores[section.id] || 0}
/
${section.max}
</b>
</div>
`).join("")}
</div>
<button class="delete"
onclick="deleteEvaluation('${item.branch}','${item.date}')">
🗑️ حذف هذا التقييم
</button>
</div>
`;
});
document.getElementById("evaluationsList").innerHTML=html;
}
/* حذف تقييم */
function deleteEvaluation(branch,date){
if(!confirm(
"هل أنت متأكد من حذف هذا التقييم؟"
)){
return;
}
let data=getData();
data=data.filter(item=>!(
item.branch===branch &&
item.date===date
));
saveData(data);
showEvaluations();
alert("تم حذف التقييم ✅");
}
/* الأسبوع */
function getWeek(offset){
let now=new Date();
let day=now.getDay();
if(day===0)day=7;
let monday=new Date(now);
monday.setDate(
now.getDate()-day+1+(offset*7)
);
let sunday=new Date(monday);
sunday.setDate(
monday.getDate()+6
);
function format(d){
return d.getFullYear()+
"-"+
String(d.getMonth()+1).padStart(2,"0")+
"-"+
String(d.getDate()).padStart(2,"0");
}
return[
format(monday),
format(sunday)
];
}
function average(branch,start,end){
let data=getData();
let list=data.filter(item=>
item.branch===branch &&
item.date>=start &&
item.date<=end
);
if(!list.length)return null;
return list.reduce(
(sum,item)=>sum+item.score,
0
)/list.length;
}
function sectionAverage(branch,start,end,sectionId){
let data=getData();
let list=data.filter(item=>
item.branch===branch &&
item.date>=start &&
item.date<=end
);
if(!list.length)return null;
return list.reduce(
(sum,item)=>
sum+
Number(item.scores?.[sectionId]||0),
0
)/list.length;
}
/* التقرير */
function weeklyReport(){
let current=getWeek(0);
let previous=getWeek(-1);
let results=[];
branches.forEach(branch=>{
let currentAvg=
average(
branch,
current[0],
current[1]
);
let previousAvg=
average(
branch,
previous[0],
previous[1]
);
if(currentAvg!==null){
results.push({
branch:branch,
current:currentAvg,
previous:previousAvg,
change:
previousAvg===null
?null
:currentAvg-previousAvg
});
}
});
results.sort(
(a,b)=>b.current-a.current
);
let today=
new Date().toLocaleDateString("ar-IQ");
let html=
'<div class="reportHeader">'+
"<h2>📊 التقرير الأسبوعي</h2>"+
"<p><b>تاريخ التقرير:</b> "+
today+
"</p>"+
"<p><b>الأسبوع الحالي:</b> "+
current[0]+
" إلى "+
current[1]+
"</p>"+
"<p><b>الأسبوع السابق:</b> "+
previous[0]+
" إلى "+
previous[1]+
"</p>"+
"</div>";
if(!results.length){
html+="<p>لا توجد تقييمات محفوظة لهذا الأسبوع.</p>";
document.getElementById("report").innerHTML=html;
return;
}
results.forEach((item,index)=>{
let status="";
let className="same";
let percent="";
if(item.change===null){
status="جديد";
}else{
let p=
item.previous===0
?0
:(item.change/item.previous)*100;
percent=
" ("+
(p>0?"+":"")+
p.toFixed(1)+
"%)";
if(item.change>0){
status="⬆️ متحسن";
className="good";
}else if(item.change<0){
status="⬇️ متراجع";
className="bad";
}else{
status="➖ ثابت";
}
}
let strengths=[];
let weaknesses=[];
sections.forEach(section=>{
let avg=
sectionAverage(
item.branch,
current[0],
current[1],
section.id
);
if(avg===null)return;
let percentage=
(avg/section.max)*100;
if(percentage>=80){
strengths.push(
section.name+
" "+
avg.toFixed(1)+
"/"+
section.max
);
}
if(percentage<60){
weaknesses.push(
section.name+
" "+
avg.toFixed(1)+
"/"+
section.max
);
}
});
html+=
'<div class="row">'+
"<h3>"+
(index+1)+
". "+
item.branch+
"</h3>"+
"<b>تقييم الأسبوع الحالي:</b> "+
item.current.toFixed(1)+
" / 100<br>"+
"<b>الأسبوع السابق:</b> "+
(
item.previous===null
?"لا يوجد"
:item.previous.toFixed(1)+
" / 100"
)+
"<br><br>"+
'<span class="'+
className+
'">'+
status+
percent+
"</span>"+
"<br><br>"+
'<b class="strength">💪 نقاط القوة:</b><br>'+
(
strengths.length
?strengths.join("<br>")
:"لا توجد نقاط قوة مميزة"
)+
"<br><br>"+
'<b class="weakness">⚠️ نقاط الضعف:</b><br>'+
(
weaknesses.length
?weaknesses.join("<br>")
:"لا توجد نقاط ضعف كبيرة"
)+
"</div>";
});
document.getElementById("report").innerHTML=html;
}
/* PDF */
function downloadPDF(){
weeklyReport();
setTimeout(()=>{
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
let report=
document.getElementById("report").innerText;
pdf.setFontSize(10);
let lines=
pdf.splitTextToSize(
report,
180
);
pdf.text(
lines,
10,
15
);
let today=
new Date()
.toISOString()
.split("T")[0];
pdf.save(
"تقرير-الفروع-"+today+".pdf"
);
},300);
}
</script>
</body>
</html>
