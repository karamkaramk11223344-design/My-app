<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحتي الأولى</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      text-align: center;
    }

    header {
      background: #222;
      color: white;
      padding: 25px;
    }

    main {
      padding: 50px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <header>
    <h2>مشروعي الأول</h2>
  </header>

  <main>
    <h1>مرحباً بك 👋</h1>
    <p>هذه أول صفحة ويب لي على GitHub.</p>

    <button onclick="showMessage()">
      اضغط هنا
    </button>
  </main>

  <script>
    function showMessage() {
      alert("أهلاً بك! 🎉");
    }
  </script>

</body>
</html>
